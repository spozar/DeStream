name: Release

# Releasing is bumping MARKETING_VERSION in project.yml and pushing to main.
# Every push asks whether that version already has a tag: if so it is an ordinary commit and the run stops
# on Linux in seconds; if not, a macOS runner builds, signs, notarizes and publishes v<version> with the
# .dmg and .zip attached. The tag is created by the release itself, so it only ever exists for a version
# that really published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this a release?
        id: decide
        run: |
          VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          [ -n "$VERSION" ] || { echo "::error::No MARKETING_VERSION in project.yml."; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released, so this is an ordinary commit."
            echo "release=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skipped, not failed: an unsigned build would trip Gatekeeper on every friend's Mac.
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::warning::v$VERSION is unreleased, but the signing/notarization secrets are not set, so nothing was published. See RELEASING.md."
            echo "release=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=yes" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'yes'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          # Without this, codesign blocks on a UI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: .build/spm
          key: spm-${{ hashFiles('DeStream.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve packages
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -scheme DeStream -clonedSourcePackagesDirPath .build/spm \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build, sign, notarize and package
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/dmg-mac.sh

      - name: Check what came out
        run: |
          APP=.build/export-dmg/DeStream.app
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime' || true
          xcrun stapler validate "$APP"
          xcrun stapler validate "dist/DeStream-$VERSION.dmg"
          ls -lh dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          # This version's CHANGELOG.md section when there is one, otherwise GitHub's list of commits.
          SECTION="$(awk -v v="$VERSION" '
            $0 ~ "^## +\\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          {
            printf '%s\n\n' "$SECTION"
            echo "**Install:** open the \`.dmg\` and drag **DeStream** onto Applications. The \`.zip\` holds the same app."
            echo
            echo "Requires macOS 14 or later. Signed with Developer ID and notarized by Apple."
          } > "$NOTES"
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then GENERATE=--generate-notes; fi

          gh release create "v$VERSION" "dist/DeStream-$VERSION.dmg" "dist/DeStream-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "DeStream $VERSION" --notes-file "$NOTES" ${GENERATE:-}
